# ~/.tmux.conf
# Deliberately minimal: stock/default tmux behavior (prefix stays C-b, default
# keybinds, default status bar) so it's good for LEARNING. The only thing added
# is session persistence across reboots via resurrect + continuum.
#
# Cheat sheet: prefix = Ctrl-b, then:
#   c new window   n/p next/prev   ,  rename window
#   %  split vert  "  split horiz  o  cycle panes  arrows move
#   d  detach      [  scroll/copy mode   ?  list all keybinds
# Save/restore is automatic; manual: prefix Ctrl-s (save)  prefix Ctrl-r (restore)

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# --- Session persistence ---
set -g @continuum-restore 'on'                  # restore last session on server start
set -g @continuum-save-interval '5'             # auto-save every 5 min
set -g @continuum-boot 'on'                      # start tmux on boot (systemd user svc)
set -g @resurrect-capture-pane-contents 'on'     # save scrollback too
set -g @resurrect-strategy-nvim 'session'        # restore nvim session
set -g @resurrect-processes 'ssh kubectl kubie k9s watch lazygit "~claude"'

# --- Initialize TPM (keep at the very bottom) ---
run -b '~/.tmux/plugins/tpm/tpm'
