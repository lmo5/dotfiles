### ==============================
### 🧩 Tmux DevOps Configuration v2
### ==============================

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'wfxr/tmux-power'
set -g @plugin 'wfxr/tmux-net-speed'
set -g @plugin 'robhurring/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin '~/.tmux/plugins/tmux-kube-context'


# --- Theme setup ---
set -g @tmux_power_theme 'snow'
set -g @tmux_power_show_upload_speed false
set -g @tmux_power_show_download_speed false
set -g @catppuccin_flavour 'macchiato' # frappe / latte / mocha / macchiato
set -g @catppuccin_status_modules_right "cpu battery date_time"

# --- Continuum/Resurrect ---
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'    # auto-save every 5 min
set -g @continuum-boot 'on'            # start tmux server on OS boot (systemd user svc)

# Restore scrollback buffer contents, not just layout
set -g @resurrect-capture-pane-contents 'on'
# Also restore the working program in each pane (best-effort; interactive
# state like a live claude/ssh session is NOT preserved, only relaunched).
# '~cmd' = match full command line. Trim to taste.
set -g @resurrect-processes 'ssh kubectl kubie k9s watch lazygit "~claude"'
# Bring back the exact vim/nvim session (uses the session-plugin if present)
set -g @resurrect-strategy-nvim 'session'

# --- TPM initialization (keep at bottom of plugin section) ---
run -b '~/.tmux/plugins/tpm/tpm'


### ==============================
### ⚙️ Core Settings
### ==============================

set -g default-terminal "tmux-256color"
set-option -g default-shell /usr/bin/zsh
set -s escape-time 1

# Vim-style copy mode and navigation
set -g status-keys vi
set -g mode-keys vi

# Disable auto-renaming windows
set -g set-titles off
setw -g automatic-rename off
set -g allow-rename off

# Start window index at 1
set -g base-index 1

# Message display time
set -g display-time 1500

# Terminal color and mouse support
set -g mouse on
set -g terminal-overrides 'xterm*mcup@:rmcup@'
set-option -sa terminal-overrides ',xterm*:Tc'

# Notifications
set-window-option -g monitor-activity on
set -g visual-activity off

# Scrollback buffer
set -g history-limit 50000


### ==============================
### ⌨️ Keybindings
### ==============================

# Prefix key
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload configuration
bind r source-file ~/.tmux.conf \; display "✅ tmux.conf reloaded!"

# Split panes
bind | split-window -h
bind _ split-window -v

# Navigate between panes with Alt+arrows
bind -n M-left select-pane -L
bind -n M-right select-pane -R
bind -n M-up select-pane -U
bind -n M-down select-pane -D

# Switch windows with Ctrl+arrow
bind-key -n C-right next-window
bind-key -n C-left previous-window

# Zoom/Unzoom current pane
bind z resize-pane -Z

# Synchronize panes
bind S set-window-option synchronize-panes \; display-message "🔁 Panes sync: #{?pane_synchronized,on,off}"

# Rename window
bind R command-prompt -I "#W" "rename-window '%%'"

# Kill pane quickly
bind x kill-pane

# Save / restore session manually (tmux-resurrect)
bind-key C-s run-shell ~/.tmux/plugins/tmux-resurrect/scripts/save.sh
bind-key C-u run-shell ~/.tmux/plugins/tmux-resurrect/scripts/restore.sh


### ==============================
### 🚀 DevOps Power Shortcuts
### ==============================

# --- Sessionizer: jump between Git projects ---
bind-key p run-shell "tmux new-window -n sessionizer 'tmux-sessionizer'"

# --- FZF file finder (open in Vim) ---
bind-key f split-window -v -c '#{pane_current_path}' "fzf-tmux | xargs nvim"

# --- Kubernetes helpers ---
bind-key k split-window -v "kubectl get pods -A --no-headers | fzf | awk '{print \$2}' | xargs -I {} kubectl logs -f {}"
bind-key e split-window -v "kubectl get pods -A --no-headers | fzf | awk '{print \$2}' | xargs -I {} kubectl exec -it {} -- sh"

# --- Copycat search ---
bind / copy-mode \; send -X search-forward


### ==============================
### 🎨 Status bar (tmux-power + Catppuccin)
### ==============================

set -g status-interval 5
set -g status-justify centre
set -g status-bg default
set -g status-fg white

set -g status-left-length 50
set -g status-right-length 120

set -g status-left '#[bold,fg=cyan]#S #[fg=white]| #[fg=green]#I:#W '
set -g status-right '#[fg=yellow]#(tmux-cpu) #[fg=blue]#(date +"%H:%M") #[fg=magenta]#(tmux-battery)'


### ==============================
### 🧰 Quality of Life
### ==============================

# Copy mode (Vi-style)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Faster Esc response
set -sg escape-time 10

# Display active pane border color
set -g pane-active-border-style 'fg=green'
